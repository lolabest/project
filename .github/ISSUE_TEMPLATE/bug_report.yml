name: Bug report
description: Report incorrect gameplay, crashes, or visual defects
title: "[Bug]: "
labels: ["bug", "needs reproduction"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Bubble Shooter. Please search existing issues first.
  - type: input
    id: version
    attributes:
      label: Version
      description: Version shown in the footer or `BS.CONSTANTS.VERSION`
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: Browser
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 15 / iOS 18 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open index.html
        2. Click Play
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Paste any browser console output (or write "None")
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Screenshots / additional context
      description: Drag images here or link a short recording
